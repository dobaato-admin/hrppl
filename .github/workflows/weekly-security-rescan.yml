name: Weekly security re-scan

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

# Posts findings from ALL available scanners into the unified findings queue at
# /api/public/hooks/security-scan-results. The ingest endpoint dedupes by
# (scanner_name, internal_id) signature, so re-runs are idempotent and only
# net-new ERROR-level findings page super admins via email + webhook fan-out.
#
# Sources covered:
#   - github-actions.weekly     : regression suite pass/fail
#   - npm-audit                 : high/critical dependency advisories
#   - connector_security_scan   : Wiz / connector posture findings (read from
#                                 .security/connector-findings.json if present
#                                 — populated by the Wiz scheduled export)
#
# Real SAST runs in security.yml; this job is the central importer.
jobs:
  rescan:
    name: Submit multi-scanner findings to portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run regression tests
        id: regression
        continue-on-error: true
        run: bunx vitest run tests/security-regression.test.ts tests/admin-routes-block.test.ts tests/cron-auth.test.ts

      - name: npm audit (high+)
        id: audit
        continue-on-error: true
        run: |
          bun pm audit --json > /tmp/audit.json 2>/dev/null || true
          test -s /tmp/audit.json || echo '{}' > /tmp/audit.json

      - name: Build payload + sign + POST
        env:
          SECURITY_SCAN_WEBHOOK_SECRET: ${{ secrets.SECURITY_SCAN_WEBHOOK_SECRET }}
          INGEST_URL: ${{ vars.SECURITY_SCAN_INGEST_URL || 'https://hrppl.io/api/public/hooks/security-scan-results' }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const findings = [];

            // 1) Regression suite
            const regressionPassed = process.env.REGRESSION_OUTCOME === 'success';
            findings.push({
              scanner_name: 'github-actions.weekly',
              internal_id: 'regression-' + new Date().toISOString().slice(0,10),
              title: regressionPassed
                ? 'Weekly security regression suite passed'
                : 'Weekly security regression suite FAILED',
              severity: regressionPassed ? 'info' : 'error',
              status: regressionPassed ? 'fixed' : 'open',
              description: regressionPassed
                ? 'All static security regression checks passed (admin-routes-block, security-regression, cron-auth).'
                : 'One or more static security regression checks failed; investigate immediately.',
            });

            // 2) npm audit -> dedupe by advisory id (signature stable across runs)
            try {
              const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
              const advisories = audit.advisories || (audit.vulnerabilities ? Object.values(audit.vulnerabilities) : []);
              for (const adv of advisories) {
                const sev = (adv.severity || adv.severity_label || 'low').toLowerCase();
                if (sev !== 'high' && sev !== 'critical') continue;
                findings.push({
                  scanner_name: 'npm-audit',
                  internal_id: 'advisory-' + (adv.id || adv.url || adv.name),
                  title: (adv.title || adv.name || 'npm vulnerability') + ' (' + sev + ')',
                  severity: 'error',
                  status: 'open',
                  description: adv.overview || adv.url || '',
                  remediation: adv.recommendation || adv.fixAvailable ? 'Run bun update for the affected package.' : '',
                });
              }
            } catch (e) { console.error('npm audit parse failed:', e.message); }

            // 3) Connector findings (Wiz etc.) — exported by the Wiz scheduled job
            //    into .security/connector-findings.json with shape:
            //    [{ internal_id, title, severity, status?, description?, remediation? }]
            try {
              if (fs.existsSync('.security/connector-findings.json')) {
                const items = JSON.parse(fs.readFileSync('.security/connector-findings.json', 'utf8'));
                for (const item of items) {
                  findings.push({
                    scanner_name: 'connector_security_scan',
                    internal_id: String(item.internal_id),
                    title: String(item.title || 'Connector security finding'),
                    severity: (item.severity === 'error' || item.severity === 'warn' || item.severity === 'info') ? item.severity : 'warn',
                    status: item.status || 'open',
                    description: item.description || '',
                    remediation: item.remediation || '',
                  });
                }
              }
            } catch (e) { console.error('connector findings parse failed:', e.message); }

            const body = JSON.stringify({ scanned_at: new Date().toISOString(), findings });
            const sig = crypto.createHmac('sha256', process.env.SECURITY_SCAN_WEBHOOK_SECRET).update(body).digest('hex');
            const url = process.env.INGEST_URL;
            console.log('Submitting ' + findings.length + ' finding(s) to ' + url);
            fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-scan-signature': sig }, body })
              .then(async (r) => { console.log('ingest:', r.status, await r.text()); if (!r.ok) process.exit(1); })
              .catch((e) => { console.error(e); process.exit(1); });
          "
