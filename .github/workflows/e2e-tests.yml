name: E2E routing tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Fail the build if Google-signup routing, the Create organization option,
# or the invitation-acceptance flow regresses.
jobs:
  e2e:
    name: Playwright + routing contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Source-level routing contract (vitest)
        run: bun run test -- tests/google-signup-routing.test.ts 2>&1 | tee vitest-routing.log

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E (Google sign-up + invitation flows)
        run: bun run test:e2e 2>&1 | tee playwright.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright.log
            vitest-routing.log
          if-no-files-found: ignore
