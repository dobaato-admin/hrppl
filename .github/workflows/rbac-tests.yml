name: RBAC tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rbac-tests:
    name: Run RBAC integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test 2>&1 | tee test-output.log
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload test output artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-test-output
          path: test-output.log

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          payload=$(cat <<EOF
          {
            "text": ":x: RBAC tests failed on \`${{ github.repository }}\` (${{ github.ref_name }})\n• Run: ${RUN_URL}\n• Artifact (test-output.log): ${ARTIFACT_URL:-$RUN_URL}\n• Commit: ${{ github.sha }}"
          }
          EOF
          )
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
