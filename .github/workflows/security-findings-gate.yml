name: Security findings gate

# Blocks merges when the persisted security findings portal reports any
# OPEN error-level (high/critical) findings across any scanner — Wiz,
# connector_security_scan, supabase_lov, dependency audit, etc.
#
# Reads the live count from the published API endpoint that backs the
# /admin/security-findings dashboard. The endpoint requires no auth
# (count-only, no PII) and is served from the same TanStack route file.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  block-on-open-criticals:
    name: Block on open high/critical findings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query findings portal
        id: query
        env:
          # Was defaulting to hrppl.lovable.app — a stale pre-Vercel-migration
          # domain (see CLAUDE.md "Deployment — Vercel": the live app is
          # hrppl.vercel.app). That domain 302-redirected with an empty body,
          # which curl's -f does not treat as a failure (redirects aren't
          # 4xx/5xx), so the fallback below never triggered and the empty
          # body reached `python3 -c json.load(...)`, which threw — a hard
          # script error under `set -e`, not the graceful "not blocking"
          # path this job's own comment says it should take.
          API_BASE: ${{ vars.SECURITY_FINDINGS_API_BASE || 'https://hrppl.vercel.app' }}
        run: |
          set -uo pipefail
          echo "Querying ${API_BASE}/_serverFn/countOpenHighSeverityFindings"
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X GET \
            "${API_BASE}/_serverFn/countOpenHighSeverityFindings" \
            -H "Accept: application/json" || echo "000")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/resp.json 2>/dev/null || true
          echo
          COUNT=-1
          if [ "$HTTP_CODE" = "200" ]; then
            COUNT=$(jq -r '.open_high_critical // .result.open_high_critical // -1' /tmp/resp.json 2>/dev/null || echo -1)
            case "$COUNT" in ''|*[!0-9-]*) COUNT=-1 ;; esac
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Fail if any open high/critical findings
        run: |
          COUNT="${{ steps.query.outputs.count }}"
          if [ "$COUNT" = "-1" ]; then
            echo "::warning::Could not reach security findings portal — not blocking."
            exit 0
          fi
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Blocking merge: $COUNT open high/critical security finding(s) recorded. Review /admin/security-findings."
            exit 1
          fi
          echo "✅ No open high/critical security findings."

  deps-cve-gate:
    name: Dependency CVE gate (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fail on high/critical CVEs
        # `--prod` and `--severity` are not flags this bun `audit` recognizes
        # (`bun audit --help`: --json, --audit-level=<val>, --ignore=<val>,
        # --latest) — the previous command errored on argument parsing before
        # ever running an audit, on every run, regardless of findings.
        # `--audit-level=high` matches high AND above (critical), per bun's
        # own "greater than or equal to <level>" semantics.
        #
        # GHSA-96hv-2xvq-fx4p (ws memory-exhaustion DoS, <8.21.0) is ignored:
        # `bun audit fix` (2026-09-01) cleared 44 of 45 in-range findings;
        # this one's dependents (@tanstack/devtools-bundler-core's vite
        # plugin, and react-email's socket.io->socket.io-adapter chain) both
        # pin `ws@~8.20.1` themselves, so bumping past it needs `--latest`
        # (crosses their declared ranges) or an upstream release. Both paths
        # are dev-tooling (Vite devtools panel, local email preview), not
        # code shipped to end users. Revisit by dropping this --ignore once
        # either dependent bumps its own ws range.
        run: bun audit --audit-level=high --ignore=GHSA-96hv-2xvq-fx4p
