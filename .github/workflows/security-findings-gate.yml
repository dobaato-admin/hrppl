name: Security findings gate

# Blocks merges when `security_findings_log` holds any OPEN error-level
# (high/critical) findings from any scanner — Wiz, connector_security_scan,
# supabase_lov, dependency audit, etc.
#
# Reads the count straight from Postgres via PostgREST with the service-role
# key, NOT from /_serverFn/countOpenHighSeverityFindings.
#
# It used to curl that endpoint unauthenticated, and this comment used to claim
# the endpoint "requires no auth (count-only, no PII)". That stopped being true
# on 2026-09-03, when the security audit gave
# `countOpenHighSeverityFindings` a `requireSupabaseAuth` middleware and an
# `assertSuperAdmin` check — correctly, because an anonymous caller could
# otherwise read back a live count of the platform's open criticals.
#
# From then on CI got a 401, fell into the "could not reach portal" branch,
# emitted a ::warning:: and exited 0. The gate could no longer block anything
# and reported a green check while doing it — the same render-as-emptiness
# failure mode CLAUDE.md catalogues elsewhere. Hence: query the table directly,
# and make every non-enforcing state loud (see the second step).

on:
  pull_request:
    branches: [main, uat]
  push:
    branches: [main, uat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  block-on-open-criticals:
    name: Block on open high/critical findings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Count open error-level findings
        id: query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GATE_DISABLED: ${{ vars.SECURITY_GATE_DISABLED }}
        run: |
          set -uo pipefail

          # Deliberately off is a decision somebody made and can be seen in
          # the repo variables. Silently off is the bug this job used to have.
          if [ "${GATE_DISABLED:-}" = "true" ]; then
            echo "::warning::SECURITY_GATE_DISABLED=true — gate explicitly turned off."
            echo "state=disabled" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "state=no-creds" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PostgREST returns the row count in Content-Range when asked for it.
          # Range: 0-0 keeps the body to one row — this job wants the number,
          # not the findings. The service-role key bypasses RLS, which is
          # correct for CI: there is no session here to scope, and the
          # alternative (the /_serverFn endpoint) is super_admin-only by
          # design. Only the count is ever printed; the rows are not.
          HTTP_CODE=$(curl -sS -o /dev/null -D /tmp/h -w '%{http_code}' \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: count=exact" \
            -H "Range: 0-0" \
            "${SUPABASE_URL}/rest/v1/security_findings_log?select=id&status=eq.open&severity=eq.error" \
            || echo "000")
          echo "HTTP status: $HTTP_CODE"

          # e.g. "Content-Range: 0-0/42", or "*/0" when nothing matches.
          RANGE=$(tr -d '\r' < /tmp/h | awk -F': ' 'tolower($1)=="content-range"{print $2}' | tail -1)
          echo "Content-Range: ${RANGE:-<none>}"
          COUNT="${RANGE##*/}"
          case "$COUNT" in ''|*[!0-9]*) COUNT=-1 ;; esac

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "http=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "state=queried" >> "$GITHUB_OUTPUT"

      - name: Fail if any open high/critical findings
        env:
          STATE: ${{ steps.query.outputs.state }}
          COUNT: ${{ steps.query.outputs.count }}
          HTTP: ${{ steps.query.outputs.http }}
        run: |
          set -uo pipefail

          if [ "$STATE" = "disabled" ]; then
            echo "Gate disabled by repo variable — nothing enforced."
            exit 0
          fi

          # A gate with no credentials cannot enforce anything. It says so and
          # fails, rather than reporting a green check that means nothing.
          # To stand it down on purpose, set the repo variable
          # SECURITY_GATE_DISABLED=true — that is visible; silence is not.
          if [ "$STATE" = "no-creds" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set, so open"
            echo "::error::high/critical findings cannot be checked. Add both repository"
            echo "::error::secrets (rbac-tests.yml already uses them), or set the repo"
            echo "::error::variable SECURITY_GATE_DISABLED=true to stand this gate down."
            exit 1
          fi

          # Credentials are present but the query did not come back cleanly.
          # That is a broken gate, not an absent one, so it fails loudly.
          if [ "$COUNT" = "-1" ]; then
            echo "::error::Could not read security_findings_log (HTTP $HTTP). The gate is"
            echo "::error::configured but not working — check SUPABASE_URL, the service-role"
            echo "::error::key, and that the security_findings_log table still exists."
            exit 1
          fi

          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Blocking merge: $COUNT open high/critical security finding(s) recorded. Review /admin/security-findings."
            exit 1
          fi

          echo "✅ No open high/critical security findings."

  deps-cve-gate:
    name: Dependency CVE gate (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fail on high/critical CVEs
        # `--prod` and `--severity` are not flags this bun `audit` recognizes
        # (`bun audit --help`: --json, --audit-level=<val>, --ignore=<val>,
        # --latest) — the previous command errored on argument parsing before
        # ever running an audit, on every run, regardless of findings.
        # `--audit-level=high` matches high AND above (critical), per bun's
        # own "greater than or equal to <level>" semantics.
        #
        # GHSA-96hv-2xvq-fx4p (ws memory-exhaustion DoS, <8.21.0) is ignored:
        # `bun audit fix` (2026-09-01) cleared 44 of 45 in-range findings;
        # this one's dependents (@tanstack/devtools-bundler-core's vite
        # plugin, and react-email's socket.io->socket.io-adapter chain) both
        # pin `ws@~8.20.1` themselves, so bumping past it needs `--latest`
        # (crosses their declared ranges) or an upstream release. Both paths
        # are dev-tooling (Vite devtools panel, local email preview), not
        # code shipped to end users. Revisit by dropping this --ignore once
        # either dependent bumps its own ws range.
        run: bun audit --audit-level=high --ignore=GHSA-96hv-2xvq-fx4p
