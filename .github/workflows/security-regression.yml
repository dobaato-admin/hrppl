name: Security regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Fast static checks that fail the build if the super-admin guards,
# API key authorization, webhook signature, or rate-limit/bot protections
# on the Blog CMS surface ever regress.
jobs:
  regression:
    name: Blog CMS guard regression (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run security regression tests
        run: bunx vitest run tests/blog-security-regression.test.ts
